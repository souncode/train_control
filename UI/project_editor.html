<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Editor - {{ project_name }}</title>
    <style>
        :root {
            --bg: #0b1220;
            --panel: #111a2e;
            --line: #25324a;
            --text: #e6edf8;
            --muted: #8ea0ba;
            --primary: #3b82f6;
            --ok: #16a34a;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(180deg, #0a1120 0%, #0b1220 100%);
            color: var(--text);
        }
        body.msa-embed .container { max-width: none; padding: 0; }
        body.msa-embed .top, body.msa-embed .side-card,
        body.msa-embed .hint, body.msa-embed .image-info,
        body.msa-embed .floating-toolbar-toggle { display: none; }
        body.msa-embed .layout { display: block; }
        body.msa-embed .card { border: 0; border-radius: 0; padding: 0; }
        body.msa-embed .canvas-wrap { min-height: 0; height: calc(100vh - 80px); border: 0; border-radius: 0; }
        body.msa-embed .floating-toolbar { position: static; transform: none; display: block; }
        body.msa-embed .floating-toolbar-panel { border: 0; border-radius: 0; padding: 4px 8px; min-width: 0; box-shadow: none; }
        body.msa-embed .floating-toolbar-panel button { width: auto; text-align: center; }
        body.msa-embed .floating-toolbar-panel button:not(.btn-ok) { display: none; }
        body.msa-embed .status-line { padding: 4px 8px; font-size: 12px; }
        .container {
            max-width: 1880px;
            margin: 0 auto;
            padding: 18px;
        }
        .top {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .title { font-size: 20px; font-weight: 800; }
        .small { color: var(--muted); font-size: 12px; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        button {
            border: 0;
            border-radius: 10px;
            padding: 9px 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-light { background: #1a2438; color: var(--text); border: 1px solid #2c3b55; }
        .btn-ok { background: var(--ok); color: #05200d; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-success { background: #22c55e; color: #05200d; }
        .btn-predict { background: #0891b2; color: #ecfeff; }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 14px;
        }
        .floating-toolbar {
            position: fixed;
            left: 0;
            top: 92px;
            z-index: 80;
            display: flex;
            align-items: flex-start;
            transform: translateX(calc(-100% + 42px));
            transition: transform 0.18s ease;
        }
        .floating-toolbar.open {
            transform: translateX(0);
        }
        .floating-toolbar-toggle {
            width: 42px;
            height: 42px;
            border-radius: 0 10px 10px 0;
            background: #1d4ed8;
            color: #fff;
            border: 1px solid #3b82f6;
            border-left: 0;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            padding: 0;
            font-size: 18px;
            line-height: 1;
        }
        .floating-toolbar.open .floating-toolbar-toggle {
            border-radius: 0 10px 10px 0;
        }
        .floating-toolbar-panel {
            display: flex;
            flex-direction: column;
            gap: 7px;
            min-width: 190px;
            padding: 10px;
            border: 1px solid #2c3b55;
            border-left: 0;
            border-radius: 0 12px 12px 0;
            background: rgba(15, 24, 42, 0.98);
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.4);
        }
        .floating-toolbar-panel button {
            width: 100%;
            min-height: 34px;
            border-radius: 8px;
            padding: 7px 10px;
            text-align: left;
            white-space: nowrap;
        }
        .card {
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--panel);
            padding: 12px;
        }

        .canvas-wrap {
            width: 100%;
            min-height: 700px;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            border: 1px dashed #2f405f;
            border-radius: 12px;
            background: #0c1425;
            overflow: auto;
            position: relative;
        }
        #editorCanvas {
            display: block;
            max-width: none;
            height: auto;
            cursor: crosshair;
            background: #0b1220;
        }
        .class-popup {
            position: absolute;
            min-width: 220px;
            max-width: 320px;
            max-height: 260px;
            overflow: auto;
            background: #0f182a;
            border: 1px solid #2f405f;
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
            padding: 6px;
            z-index: 30;
        }
        .class-popup.hidden { display: none; }
        .class-popup-item {
            width: 100%;
            text-align: left;
            background: transparent;
            color: var(--text);
            border: 0;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: 600;
        }
        .class-popup-item:hover,
        .class-popup-item.active {
            background: #1a2740;
        }
        .class-popup-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 6px;
            padding-bottom: 6px;
            border-bottom: 1px solid #263956;
        }
        .class-popup-actions button {
            border-radius: 8px;
            padding: 7px 8px;
            font-size: 12px;
            font-weight: 800;
        }

        .field { margin-top: 10px; }
        .field label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            color: var(--muted);
        }
        input, select, textarea {
            width: 100%;
            border: 1px solid #304160;
            border-radius: 10px;
            padding: 9px 10px;
            background: #0f182a;
            color: var(--text);
        }
        textarea {
            min-height: 130px;
            resize: vertical;
            font-family: Consolas, monospace;
            font-size: 12px;
        }

        .row { display: flex; gap: 8px; align-items: center; }
        .row.wrap { flex-wrap: wrap; }

        .side-card {
            padding: 10px;
        }
        .image-browser {
            border: 1px solid #2b3d5a;
            border-radius: 12px;
            background: #0f182a;
            overflow: hidden;
        }
        .image-browser-top {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #20304a;
            background: #111c31;
        }
        .image-browser-title {
            min-width: 0;
        }
        .image-browser-title label {
            display: block;
            margin: 0 0 3px;
            color: #c7d7ee;
            font-size: 12px;
            font-weight: 800;
        }
        .count-pill {
            display: inline-flex;
            align-items: center;
            min-height: 22px;
            padding: 3px 8px;
            border: 1px solid #314562;
            border-radius: 999px;
            background: #142139;
            color: #a9bddc;
            font-size: 11px;
            font-weight: 700;
        }
        .image-search-wrap {
            min-width: 180px;
            max-width: 260px;
        }
        .image-search-wrap input {
            height: 34px;
            padding: 7px 10px;
            border-radius: 8px;
        }
        .image-filter-panel {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 8px;
            padding: 10px;
            border-bottom: 1px solid #20304a;
        }
        .filter-group {
            min-width: 0;
            border: 1px solid #263956;
            border-radius: 8px;
            background: #0c1527;
            padding: 8px;
        }
        .filter-title {
            margin-bottom: 6px;
            color: #9fb3d0;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }
        .filter-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
        }
        .filter-row.two {
            grid-template-columns: minmax(0, 1fr) 82px;
        }
        .filter-row.class-filter {
            grid-template-columns: minmax(0, 1fr) 34px;
        }
        .class-filter-dropdown {
            position: relative;
            min-width: 0;
        }
        .class-filter-toggle {
            width: 100%;
            height: 30px;
            padding: 5px 28px 5px 8px;
            border: 1px solid #2c3b55;
            border-radius: 7px;
            background: #111a2e;
            color: var(--text);
            font-size: 11px;
            font-weight: 700;
            text-align: left;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            position: relative;
        }
        .class-filter-toggle::after {
            content: "▾";
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            color: #9fb3d0;
            font-size: 10px;
        }
        .class-filter-list {
            position: absolute;
            left: 0;
            right: 0;
            top: 34px;
            z-index: 30;
            max-height: 138px;
            overflow-y: auto;
            display: grid;
            gap: 4px;
            padding: 6px 4px;
            border: 1px solid #2c3b55;
            border-radius: 8px;
            background: #0b1220;
            box-shadow: 0 14px 30px rgba(0,0,0,0.32);
        }
        .class-filter-list.hidden {
            display: none;
        }
        .class-filter-item {
            display: grid;
            grid-template-columns: 16px minmax(0, 1fr);
            align-items: center;
            gap: 6px;
            min-height: 24px;
            padding: 3px 5px;
            border-radius: 6px;
            color: #d7e3f5;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
        .class-filter-item:hover {
            background: #142033;
        }
        .class-filter-item input {
            width: 13px;
            height: 13px;
            margin: 0;
            accent-color: #3b82f6;
        }
        .class-filter-name {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .filter-group input,
        .filter-group select {
            height: 30px;
            border-radius: 7px;
            padding: 5px 7px;
            font-size: 11px;
            font-weight: 700;
        }
        .filter-group input[type="number"] {
            appearance: textfield;
            -moz-appearance: textfield;
        }
        .filter-group input[type="number"]::-webkit-outer-spin-button,
        .filter-group input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .filter-group .class-filter-item input {
            width: 13px;
            height: 13px;
            padding: 0;
            border-radius: 3px;
        }
        .filter-clear-btn {
            height: 30px;
            width: 34px;
            padding: 0;
            border-radius: 7px;
            border: 1px solid #2c3b55;
            background: #142033;
            color: #b8c7dd;
            line-height: 1;
        }
        .filter-clear-btn:hover {
            border-color: #3b82f6;
            color: #fff;
        }
        .class-list {
            border: 1px solid #2f405f;
            border-radius: 10px;
            background: #0f182a;
            padding: 8px 10px;
            max-height: 110px;
            overflow: auto;
            font-family: Consolas, monospace;
            font-size: 12px;
            line-height: 1.45;
        }
        .image-list {
            border: 0;
            border-radius: 0;
            background: #0f182a;
            height: 318px;
            max-height: 318px;
            overflow: auto;
            position: relative;
            padding: 4px 0;
        }
        .bbox-legend {
            display: none;
            flex-wrap: wrap;
            gap: 8px 12px;
            margin: 0;
            padding: 8px 10px;
            border-bottom: 1px solid #20304a;
            font-size: 11px;
            color: #a9bddc;
        }
        .bbox-legend-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .bbox-legend-swatch {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            border: 1px solid #304160;
        }
        .bbox-legend-swatch.less { background: rgba(239, 68, 68, 0.32); }
        .bbox-legend-swatch.equal { background: rgba(34, 197, 94, 0.32); }
        .bbox-legend-swatch.greater { background: rgba(245, 158, 11, 0.32); }
        .bbox-legend-swatch.notequal { background: rgba(59, 130, 246, 0.28); }
        .image-list.table-mode {
            border-radius: 0;
        }
        .image-item {
            border-bottom: 0;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 7px;
            margin: 1px 5px;
            padding: 4px 7px;
            border-radius: 5px;
            min-width: 0;
        }
        .image-item:last-child { border-bottom: 0; }
        .image-item.active { background: #263654; }
        .image-item:hover { background: #18243a; }
        .image-item.bbox-less { background: rgba(239, 68, 68, 0.14); }
        .image-item.bbox-equal { background: rgba(34, 197, 94, 0.14); }
        .image-item.bbox-greater { background: rgba(245, 158, 11, 0.14); }
        .image-item.bbox-notequal { background: rgba(59, 130, 246, 0.12); }
        .image-item.bbox-less.active { background: rgba(239, 68, 68, 0.24); }
        .image-item.bbox-equal.active { background: rgba(34, 197, 94, 0.24); }
        .image-item.bbox-greater.active { background: rgba(245, 158, 11, 0.24); }
        .image-item.bbox-notequal.active { background: rgba(59, 130, 246, 0.2); }
        .image-item .cell {
            padding: 0;
            border-right: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .image-item .cell:last-child { border-right: 0; }
        .image-item .cell.name {
            flex: 1 1 auto;
            min-width: 0;
            white-space: nowrap;
            line-height: 1.2;
        }
        .image-name-main {
            color: #f1f7ff;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .image-name-sub {
            display: none;
            margin-top: 3px;
            color: #7f93b2;
            font-size: 10px;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .image-item-meta { color: #8ea0ba; font-size: 11px; }
        .image-item-index {
            color: #8fb7ff;
            font-variant-numeric: tabular-nums;
            flex: 0 0 auto;
            width: 18px;
            font-size: 11px;
        }
        .image-item-count {
            color: #d7e9ff;
            background: #101b2d;
            border: 1px solid #2a3c59;
            border-radius: 999px;
            padding: 2px 7px;
            font-size: 11px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            flex: 0 0 auto;
        }
        .image-delete-btn {
            width: 18px;
            height: 18px;
            flex: 0 0 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            padding: 0;
            background: transparent;
            color: #ff9a9a;
            border: 1px solid transparent;
            font-size: 14px;
            line-height: 1;
        }
        .image-delete-btn:hover {
            background: rgba(239, 68, 68, 0.22);
            border-color: rgba(239, 68, 68, 0.55);
            color: #fff;
        }
        .image-item-icon {
            color: #72a8ff;
            flex: 0 0 auto;
            width: 13px;
            font-size: 12px;
            line-height: 1;
        }
        .image-list-spacer {
            position: relative;
            width: 100%;
        }
        .image-list-window {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
        }
        .advanced-label-raw {
            display: none;
        }

        .box-list {
            border: 1px solid #2f405f;
            border-radius: 10px;
            background: #0f182a;
            max-height: 220px;
            overflow: auto;
        }
        .box-item {
            padding: 8px 10px;
            border-bottom: 1px solid #1f2b41;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }
        .box-item:last-child { border-bottom: 0; }
        .box-item.active { background: #1a2740; }

        .status-line {
            margin-top: 8px;
            font-size: 12px;
            color: #9dd6ff;
        }
        .load-progress {
            margin-top: 8px;
            border: 1px solid #2c3b55;
            border-radius: 10px;
            background: #0f182a;
            padding: 8px 10px;
        }
        .load-progress.hidden { display: none; }
        .load-progress-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 6px;
            font-size: 12px;
            color: #cfe6ff;
        }
        .load-progress-bar {
            height: 8px;
            border-radius: 999px;
            overflow: hidden;
            background: #18253a;
        }
        .load-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6 0%, #22c55e 100%);
            transition: width 0.18s ease;
        }
        .hint { color: #93a4bf; font-size: 12px; margin-top: 6px; }
        .image-info {
            margin-top: 10px;
            border: 1px solid #2c3b55;
            border-radius: 10px;
            background: #0f182a;
            padding: 10px;
            font-size: 12px;
            line-height: 1.5;
        }
        .image-info a {
            color: #7cc6ff;
            text-decoration: none;
            word-break: break-all;
        }
        .image-info a:hover { text-decoration: underline; }

        @media (max-width: 1100px) {
            .layout { grid-template-columns: 1fr; }
            .canvas-wrap { min-height: 360px; }
            .image-browser-top,
            .image-filter-panel {
                grid-template-columns: 1fr;
            }
            .image-search-wrap {
                max-width: none;
            }
        }
    </style>
</head>
<body class="{% if request.args.get('msa') == '1' %}msa-embed{% endif %}">
<div class="floating-toolbar" id="floatingToolbar">
    <div class="floating-toolbar-panel">
        <button class="btn-ok" onclick="saveLabel()">Save ảnh</button>
        <button class="btn-success" onclick="openProjectDataUpload()">Add data</button>
        <button class="btn-predict" onclick="runQuickPredictUnlabeled()">Quick Predict</button>
        <button class="btn-primary" id="promoteTrainBtn" onclick="saveLabelAndMoveToTrain()" style="display:none">Save + Move to train</button>
    </div>
    <button class="floating-toolbar-toggle" type="button" onclick="toggleFloatingToolbar()" aria-label="Toggle toolbar">›</button>
</div>
<input
    type="file"
    id="projectDataInput"
    accept=".zip,image/*"
    multiple
    style="display:none"
    onchange="handleProjectDataUploadInput(this)"
>
<div class="container">
    <div class="top">
        <div>
            <div class="title">Project Label Editor</div>
            <div class="small">Project: <b>{{ project_name }}</b></div>
        </div>
        <div class="actions">
            <button class="btn-light" onclick="window.location.href='/'">Back</button>
        </div>
    </div>

    <div class="layout">
        <div class="card">
            <div class="canvas-wrap">
                <canvas id="editorCanvas"></canvas>
                <div id="classPopup" class="class-popup hidden"></div>
            </div>
            <div class="status-line" id="statusLine">Loading...</div>
            <div class="load-progress hidden" id="loadProgress">
                <div class="load-progress-head">
                    <span id="loadProgressText">Loading...</span>
                    <span id="loadProgressPct">0%</span>
                </div>
                <div class="load-progress-bar">
                    <div class="load-progress-fill" id="loadProgressFill"></div>
                </div>
            </div>
            <div class="hint">Kéo thả bbox để đổi vị trí. Click bbox để chọn.</div>
            <div class="image-info" id="imageInfo">
                <div><b>Tên:</b> -</div>
                <div><b>Ngày sửa:</b> -</div>
                <div><b>Link:</b> -</div>
                <div><b>Tổng ảnh:</b> -</div>
            </div>
        </div>

        <div class="card side-card">
            <div class="image-browser">
                <div class="image-browser-top">
                    <div class="image-browser-title">
                        <label>Danh sách ảnh</label>
                        <span class="count-pill" id="pageInfo">0 ảnh</span>
                    </div>
                    <div class="image-search-wrap">
                        <input id="imageSearch" type="text" placeholder="Tìm tên ảnh..." oninput="onImageSearchChanged()" />
                    </div>
                </div>
                <div class="image-filter-panel" id="imageFilterPanel"></div>
                <div class="bbox-legend">
                    <span class="bbox-legend-item"><span class="bbox-legend-swatch less"></span>Thiếu</span>
                    <span class="bbox-legend-item"><span class="bbox-legend-swatch equal"></span>Đúng</span>
                    <span class="bbox-legend-item"><span class="bbox-legend-swatch greater"></span>Dư</span>
                    <span class="bbox-legend-item"><span class="bbox-legend-swatch notequal"></span>Khác</span>
                </div>
                <div class="image-list table-mode" id="imageList"></div>
            </div>

            <div class="field">
                <label>Class của bbox đang chọn</label>
                <div class="row">
                    <select id="boxClassSelect" onchange="changeSelectedBoxClass()"></select>
                </div>
            </div>

            <div class="field advanced-label-raw">
                <label>Raw label (.txt)</label>
                <textarea id="rawLabel" readonly></textarea>
            </div>
        </div>
    </div>
</div>

<script>
const projectName = {{ project_name | tojson }};
const editorQuery = new URLSearchParams(window.location.search);
const msaMode = editorQuery.get('msa') === '1';
const initialRel = editorQuery.get('rel') || '';
const initialValidRel = editorQuery.get('valid_rel') || '';
let images = [];
let imageItems = [];
let idx = 0;
let classes = [];
let currentPage = 1;
let pageSize = 1000000;
let totalImages = 0;
let totalPages = 0;
let currentQuery = '';
let sortBy = 'name';
let sortDir = 'asc';
let classFilter = '';
let classFilterOpen = false;
let expectedBoxCount = '';
let boxCompare = 'all';
let anomalyFilter = 'all';
let anomalySensitivity = 'medium';

function esc(text) {
    return String(text ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}

async function apiGet(url, opts = {}) {
    const res = await fetch(url, opts);
    const data = await res.json();
    if (!res.ok || data.ok === false) {
        throw new Error(data.message || `HTTP ${res.status}`);
    }
    return data;
}

function uploadEditorFilesWithProgress(url, files, extraFields = {}, title = 'Đang upload...') {
    return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        const fd = new FormData();
        Array.from(files || []).forEach(file => fd.append('files', file));
        if (files && files.length === 1) fd.append('file', files[0]);
        Object.entries(extraFields || {}).forEach(([key, value]) => fd.append(key, value));

        xhr.open('POST', url);
        xhr.responseType = 'json';

        xhr.upload.onprogress = (e) => {
            const pct = e.lengthComputable ? (e.loaded / Math.max(1, e.total)) * 100 : 0;
            setEditorLoadProgress(pct, title);
        };
        xhr.upload.onload = () => setEditorLoadProgress(100, 'Server đang xử lý...');
        xhr.onload = () => {
            const resp = xhr.response || {};
            if (xhr.status >= 200 && xhr.status < 300 && resp.ok !== false) {
                resolve(resp);
                return;
            }
            reject(new Error(resp.message || `HTTP ${xhr.status}`));
        };
        xhr.onerror = () => reject(new Error('Upload lỗi mạng'));
        xhr.onabort = () => reject(new Error('Upload đã bị hủy'));
        xhr.send(fd);
    });
}

function classNameByIndex(i) {
    if (i >= 0 && i < classes.length) return classes[i];
    return `class_${i}`;
}

function bboxColorForClass(clsIndex, anomaly = false) {
    const name = String(classNameByIndex(clsIndex) || '').trim().toUpperCase();
    if (name.endsWith('_NG')) {
        return {
            stroke: '#ef4444',
            fill: 'rgba(239,68,68,0.14)',
            label: 'rgba(239,68,68,0.95)',
        };
    }
    if (name.endsWith('_OK')) {
        return {
            stroke: '#22c55e',
            fill: 'rgba(34,197,94,0.14)',
            label: 'rgba(34,197,94,0.95)',
        };
    }
    if (anomaly) {
        return {
            stroke: '#ef4444',
            fill: 'rgba(239,68,68,0.14)',
            label: 'rgba(239,68,68,0.95)',
        };
    }
    return {
        stroke: '#3b82f6',
        fill: 'rgba(59,130,246,0.16)',
        label: 'rgba(59,130,246,0.95)',
    };
}

function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
}

function canvasPointFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);
    return { x, y };
}

function scaleBoxes(scale) {
    boxes.forEach(b => {
        b.x *= scale;
        b.y *= scale;
        b.w *= scale;
        b.h *= scale;
    });
}

function setCanvasZoom(newZoom, anchorEvent = null) {
    if (!canvas || !baseImg || !fitDrawW || !fitDrawH) return;
    const nextZoom = clamp(Number(newZoom) || 1, minZoomLevel, maxZoomLevel);
    const scale = nextZoom / Math.max(0.0001, zoomLevel);
    if (Math.abs(scale - 1) < 0.001) return;

    const wrap = document.querySelector('.canvas-wrap');
    const beforeRect = canvas.getBoundingClientRect();
    const anchorClientX = anchorEvent ? anchorEvent.clientX : beforeRect.left + beforeRect.width / 2;
    const anchorClientY = anchorEvent ? anchorEvent.clientY : beforeRect.top + beforeRect.height / 2;
    const anchorX = (anchorClientX - beforeRect.left) * (canvas.width / Math.max(1, beforeRect.width));
    const anchorY = (anchorClientY - beforeRect.top) * (canvas.height / Math.max(1, beforeRect.height));

    zoomLevel = nextZoom;
    scaleBoxes(scale);
    drawW = Math.max(1, Math.round(fitDrawW * zoomLevel));
    drawH = Math.max(1, Math.round(fitDrawH * zoomLevel));
    canvas.width = drawW;
    canvas.height = drawH;
    draw();

    if (wrap) {
        const afterRect = canvas.getBoundingClientRect();
        const nextClientX = afterRect.left + (anchorX * scale) * (afterRect.width / Math.max(1, canvas.width));
        const nextClientY = afterRect.top + (anchorY * scale) * (afterRect.height / Math.max(1, canvas.height));
        wrap.scrollLeft += nextClientX - anchorClientX;
        wrap.scrollTop += nextClientY - anchorClientY;
    }
}

function onCanvasWheel(e) {
    if (!canvas || !baseImg) return;
    const rect = canvas.getBoundingClientRect();
    const insideCanvas = e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom;
    if (!insideCanvas) return;
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    setCanvasZoom(zoomLevel * factor, e);
}

function hitBoxIndex(x, y) {
    for (let i = boxes.length - 1; i >= 0; i--) {
        const b = boxes[i];
        if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
            return i;
        }
    }
    return -1;
}

function getBoxLabelRect(b) {
    const label = `${b.cls}: ${classNameByIndex(b.cls)}`;
    ctx.font = '12px Segoe UI';
    const tw = ctx.measureText(label).width + 10;
    const th = 18;
    const tx = b.x;
    const ty = Math.max(0, b.y - th);
    return {
        x: tx,
        y: ty,
        w: tw,
        h: th,
    };
}

function getBoxActionRects(b) {
    const labelRect = getBoxLabelRect(b);
    const gap = 3;
    const size = 18;
    const y = labelRect.y;
    const dupX = Math.min(drawW - (size * 2 + gap), labelRect.x + labelRect.w + gap);
    return {
        duplicate: {x: dupX, y, w: size, h: size},
        delete: {x: dupX + size + gap, y, w: size, h: size},
    };
}

function hitBoxAction(x, y) {
    if (!ctx) return null;
    for (let i = boxes.length - 1; i >= 0; i--) {
        const rects = getBoxActionRects(boxes[i]);
        for (const action of ['duplicate', 'delete']) {
            const r = rects[action];
            if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) {
                return { index: i, action };
            }
        }
    }
    return null;
}

function hitBoxLabelIndex(x, y) {
    if (!ctx) return -1;
    for (let i = boxes.length - 1; i >= 0; i--) {
        const b = boxes[i];
        const r = getBoxLabelRect(b);
        if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) {
            return i;
        }
    }
    return -1;
}

function handlePoints(b) {
    return {
        nw: {x: b.x, y: b.y},
        n: {x: b.x + b.w / 2, y: b.y},
        ne: {x: b.x + b.w, y: b.y},
        e: {x: b.x + b.w, y: b.y + b.h / 2},
        se: {x: b.x + b.w, y: b.y + b.h},
        s: {x: b.x + b.w / 2, y: b.y + b.h},
        sw: {x: b.x, y: b.y + b.h},
        w: {x: b.x, y: b.y + b.h / 2},
    };
}

function hitResizeHandle(x, y, b) {
    const pts = handlePoints(b);
    const r = 9;
    for (const key of ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w']) {
        const p = pts[key];
        if (Math.abs(x - p.x) <= r && Math.abs(y - p.y) <= r) {
            return key;
        }
    }
    return '';
}

function parseYoloLabel(text, anomalyIndexSet = null) {
    const rows = [];
    let boxIndex = 0;
    const lines = String(text || '').replace(/\r\n/g, '\n').split('\n');
    for (const line of lines) {
        const s = line.trim();
        if (!s) continue;
        const parts = s.split(/\s+/);
        if (parts.length < 5) continue;

        const cls = parseInt(parts[0], 10);
        const cx = parseFloat(parts[1]);
        const cy = parseFloat(parts[2]);
        const w = parseFloat(parts[3]);
        const h = parseFloat(parts[4]);

        if ([cls, cx, cy, w, h].some(v => Number.isNaN(v))) continue;

        const bw = clamp(w, 0, 1) * drawW;
        const bh = clamp(h, 0, 1) * drawH;
        const x = clamp(cx, 0, 1) * drawW - bw / 2;
        const y = clamp(cy, 0, 1) * drawH - bh / 2;
        rows.push({
            cls: Math.max(0, cls),
            x: clamp(x, 0, Math.max(0, drawW - bw)),
            y: clamp(y, 0, Math.max(0, drawH - bh)),
            w: clamp(bw, 1, drawW),
            h: clamp(bh, 1, drawH),
            isAnomaly: !!(anomalyIndexSet && anomalyIndexSet.has(boxIndex)),
        });
        boxIndex += 1;
    }
    return rows;
}

function toYoloText() {
    return boxes.map(b => {
        const cx = (b.x + b.w / 2) / drawW;
        const cy = (b.y + b.h / 2) / drawH;
        const w = b.w / drawW;
        const h = b.h / drawH;
        return `${Math.max(0, Math.floor(b.cls))} ${cx.toFixed(6)} ${cy.toFixed(6)} ${w.toFixed(6)} ${h.toFixed(6)}`;
    }).join('\n');
}

function renderRawText() {
    document.getElementById('rawLabel').value = toYoloText();
}

function getAnomalyItemByBoxIndex(boxIndex) {
    return currentImageAnomalyItems.find(item => Number(item.box_index) === Number(boxIndex)) || null;
}

function formatAnomalyReasonText(anomalyItem) {
    if (!anomalyItem || !Array.isArray(anomalyItem.reasons) || anomalyItem.reasons.length === 0) return '';
    return anomalyItem.reasons.map(reason => {
        if (String(reason.metric || '') === 'name') {
            const actual = String(reason.group_name || reason.value || '').trim();
            const expected = String(reason.best_group || '').trim();
            return `NAME ${actual} -> ${expected}`;
        }
        const metric = String(reason.metric || '').toUpperCase();
        const value = Number(reason.value || 0).toFixed(2);
        const mean = Number(reason.mean || 0).toFixed(2);
        return `${metric} ${value} / avg ${mean}`;
    }).join(', ');
}

async function refreshCurrentImageAnomalies(rel = '') {
    const currentRel = String(rel || images[idx] || '').trim();
    if (!currentRel) return;
    const data = await apiGet(msaMode
        ? `/api/project/msa/label?project=${encodeURIComponent(projectName)}&rel=${encodeURIComponent(currentRel)}`
        : `/api/project_label?project=${encodeURIComponent(projectName)}&rel=${encodeURIComponent(currentRel)}&anomaly_sensitivity=${encodeURIComponent(anomalySensitivity)}`);
    currentImageAnomalyItems = Array.isArray(data.anomaly_items) ? data.anomaly_items : [];
    const anomalyIndexSet = new Set(Array.isArray(data.anomaly_box_indices) ? data.anomaly_box_indices.map(x => Number(x)) : []);
    boxes.forEach((box, boxIndex) => {
        box.isAnomaly = anomalyIndexSet.has(boxIndex);
    });
    return {
        rel: currentRel,
        bboxAnomalyCount: Number(data.bbox_anomaly_count || 0),
    };
}

function setCurrentImageStatus(rel, bboxAnomalyCount = 0, prefix = '') {

    const prefixText = prefix ? `${prefix} | ` : '';
    setStatus(`${prefixText}Image ${idx + 1}/${images.length}: ${currentRel}${anomalyText}`);

}

function renderBoxList() {
    const boxList = document.getElementById('boxList');
    if (!boxList) return;
    if (!boxes.length) {
        boxList.innerHTML = '<div class="box-item">No boxes</div>';
        return;
    }

    boxList.innerHTML = boxes.map((b, i) => {
        const active = selectedBoxes.has(i) ? 'active' : '';
        const info = `${Math.round(b.x)},${Math.round(b.y)} ${Math.round(b.w)}x${Math.round(b.h)}`;
        const warn = b.isAnomaly ? ' [ABN]' : '';
        const anomalyText = formatAnomalyReasonText(getAnomalyItemByBoxIndex(i));
        const detail = anomalyText ? `${info} | ${anomalyText}` : info;
        return `<div class="box-item ${active}" onclick="selectBox(${i})" title="${esc(detail)}"><span>#${i + 1} - ${esc(classNameByIndex(b.cls))}${warn}</span><span>${esc(detail)}</span></div>`;
    }).join('');
}

        sel.innerHTML = '<option value="0">0</option>';
    } else {
        sel.innerHTML = classes.map((c, i) => `<option value="${i}">${i}: ${esc(c)}</option>`).join('');

    if (selectedBox >= 0 && boxes[selectedBox]) {
        sel.value = String(boxes[selectedBox].cls);

function showClassPopupForBox(boxIndex, rect) {
    const el = getClassPopupEl();
    const wrap = document.querySelector('.canvas-wrap');
    if (!el || !wrap || boxIndex < 0 || !boxes[boxIndex]) return;

    selectedBox = boxIndex;
    selectedBoxes = new Set([boxIndex]);
    renderClassSelect();

    const currentCls = Number(boxes[boxIndex].cls || 0);
    const rows = classes.length
        ? classes.map((name, i) => `
            <button
                type="button"
                class="class-popup-item ${i === currentCls ? 'active' : ''}"
                onclick="selectClassFromPopup(${boxIndex}, ${i})"
            >${esc(i)}: ${esc(name)}</button>
        `).join('')
        : `<button type="button" class="class-popup-item active" onclick="selectClassFromPopup(${boxIndex}, ${currentCls})">${esc(currentCls)}: ${esc(classNameByIndex(currentCls))}</button>`;

    el.innerHTML = `
        <div class="class-popup-actions">
            <button type="button" class="btn-light" onclick="duplicateBox(${boxIndex})">Duplicate</button>
            <button type="button" class="btn-danger" onclick="deleteBoxByIndex(${boxIndex})">Xóa</button>
        </div>
        ${rows}
    `;
    el.classList.remove('hidden');
    classPopupState.visible = true;
    classPopupState.boxIndex = boxIndex;

    const popupLeft = Math.max(8, Math.min(rect.x, Math.max(8, wrap.clientWidth - 240)));
    const popupTop = Math.max(8, Math.min(rect.y + rect.h + 6, Math.max(8, wrap.clientHeight - 120)));
    el.style.left = `${popupLeft}px`;
    el.style.top = `${popupTop}px`;
}

function selectClassFromPopup(boxIndex, clsIndex) {
    if (boxIndex < 0 || !boxes[boxIndex]) return;
    boxes[boxIndex].cls = Number(clsIndex || 0);
    selectedBox = boxIndex;
    selectedBoxes = new Set([boxIndex]);
    markLabelDirty();
    hideClassPopup();
    draw();
    setStatus(`Đã đổi class bbox #${boxIndex + 1} -> ${classNameByIndex(boxes[boxIndex].cls)}`);
}

function duplicateBox(boxIndex) {
    if (boxIndex < 0 || !boxes[boxIndex]) return;
    const src = boxes[boxIndex];
    const offset = Math.max(6, Math.round(Math.min(src.w, src.h) * 0.06));
    const copy = {
        ...src,
        x: clamp(src.x + offset, 0, Math.max(0, drawW - src.w)),
        y: clamp(src.y + offset, 0, Math.max(0, drawH - src.h)),
        isAnomaly: false,
    };
    boxes.push(copy);
    selectedBox = boxes.length - 1;
    selectedBoxes = new Set([selectedBox]);
    markLabelDirty();
    hideClassPopup();
    draw();
    setStatus(`Đã duplicate bbox #${boxIndex + 1}`);
}

function deleteBoxByIndex(boxIndex) {
    if (boxIndex < 0 || !boxes[boxIndex]) return;
    boxes.splice(boxIndex, 1);
    selectedBoxes = new Set();
    selectedBox = boxes.length ? Math.min(boxIndex, boxes.length - 1) : -1;
    if (selectedBox >= 0) selectedBoxes.add(selectedBox);
    markLabelDirty();
    hideClassPopup();
    draw();
    setStatus(`Đã xóa bbox #${boxIndex + 1}`);
}

function draw() {
    if (!ctx || !baseImg) return;
    ctx.clearRect(0, 0, drawW, drawH);
    ctx.drawImage(baseImg, 0, 0, drawW, drawH);

    if (!bboxVisible) {
        renderBoxList();
        renderClassSelect();
        renderRawText();
        return;
    }

    boxes.forEach((b, i) => {
        const active = selectedBoxes.has(i);
        const anomaly = !!b.isAnomaly;
        const color = bboxColorForClass(b.cls, anomaly);
        ctx.lineWidth = active ? 3 : 2;
        ctx.strokeStyle = active ? '#facc15' : color.stroke;
        ctx.fillStyle = active ? 'rgba(250,204,21,0.16)' : color.fill;

        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeRect(b.x, b.y, b.w, b.h);

        const label = `${anomaly ? '! ' : ''}${b.cls}: ${classNameByIndex(b.cls)}`;
        ctx.font = '12px Segoe UI';
        const tw = ctx.measureText(label).width + 10;
        const th = 18;
        const tx = b.x;
        const ty = Math.max(0, b.y - th);
        ctx.fillStyle = active ? 'rgba(250,204,21,0.95)' : color.label;
        ctx.fillRect(tx, ty, tw, th);
        ctx.fillStyle = '#001020';
        ctx.fillText(label, tx + 5, ty + 13);

        const actions = getBoxActionRects(b);
        ctx.font = 'bold 11px Segoe UI';
        ctx.fillStyle = 'rgba(15,24,42,0.92)';
        ctx.fillRect(actions.duplicate.x, actions.duplicate.y, actions.duplicate.w, actions.duplicate.h);
        ctx.fillRect(actions.delete.x, actions.delete.y, actions.delete.w, actions.delete.h);
        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.lineWidth = 1;
        ctx.strokeRect(actions.duplicate.x + 0.5, actions.duplicate.y + 0.5, actions.duplicate.w - 1, actions.duplicate.h - 1);
        ctx.strokeRect(actions.delete.x + 0.5, actions.delete.y + 0.5, actions.delete.w - 1, actions.delete.h - 1);
        ctx.fillStyle = '#9dd6ff';
        ctx.fillText('D', actions.duplicate.x + 5, actions.duplicate.y + 13);
        ctx.fillStyle = '#ffb4b4';
        ctx.fillText('X', actions.delete.x + 5, actions.delete.y + 13);

        if (i === selectedBox) {
            const pts = handlePoints(b);
            ctx.fillStyle = '#22c55e';
            for (const key of ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w']) {
                const p = pts[key];
                ctx.fillRect(p.x - 4, p.y - 4, 8, 8);
            }
        }
    });

    renderBoxList();
    renderClassSelect();
    renderRawText();
}

function captureSelectedBoxPositions() {
    dragStartBoxes = new Map();
    selectedBoxes.forEach(i => {
        const b = boxes[i];
        if (!b) return;
        dragStartBoxes.set(i, { x: b.x, y: b.y, w: b.w, h: b.h });
    });
}

function moveSelectedBoxesFromDrag(dx, dy) {
    if (!dragStartBoxes.size) return;
    let minDx = -Infinity;
    let maxDx = Infinity;
    let minDy = -Infinity;
    let maxDy = Infinity;

    dragStartBoxes.forEach(pos => {
        minDx = Math.max(minDx, -pos.x);
        maxDx = Math.min(maxDx, drawW - (pos.x + pos.w));
        minDy = Math.max(minDy, -pos.y);
        maxDy = Math.min(maxDy, drawH - (pos.y + pos.h));
    });

    const safeDx = clamp(dx, minDx, maxDx);
    const safeDy = clamp(dy, minDy, maxDy);
    dragStartBoxes.forEach((pos, i) => {
        const b = boxes[i];
        if (!b) return;
        b.x = pos.x + safeDx;
        b.y = pos.y + safeDy;
    });
}

function deleteSelectedBoxes() {
    if (!selectedBoxes.size) return;
    hideClassPopup();
    boxes = boxes.filter((_, i) => !selectedBoxes.has(i));
    markLabelDirty();
    selectedBoxes = new Set();
    selectedBox = boxes.length ? 0 : -1;
    if (selectedBox >= 0) selectedBoxes.add(selectedBox);
    draw();
}

function renderImageList() {
    const box = document.getElementById('imageList');
    if (!box) return;
    if (!imageItems.length) {
        box.innerHTML = '<div class=\"image-item\"><div class=\"cell\" style=\"grid-column:1 / -1\">Không có ảnh</div></div>';
        return;
    }

    const viewportHeight = Math.max(box.clientHeight || 260, 120);
    const scrollTop = Math.max(0, box.scrollTop || 0);
    const total = imageItems.length;
    const start = Math.max(0, Math.floor(scrollTop / imageRowHeight) - imageListOverscan);
    const visibleCount = Math.ceil(viewportHeight / imageRowHeight) + imageListOverscan * 2;
    const end = Math.min(total, start + visibleCount);
    const offsetY = start * imageRowHeight;

    const rows = [];
    for (let i = start; i < end; i += 1) {
        const it = imageItems[i];
        const active = i === idx ? 'active' : '';
        const bboxCount = Number(it.bbox_count || 0);
        let compareClass = '';
        if (String(expectedBoxCount || '').trim() !== '') {
            const expected = Number(expectedBoxCount);
            if (Number.isFinite(expected)) {
                if (bboxCount < expected) compareClass = 'bbox-less';
                else if (bboxCount > expected) compareClass = 'bbox-greater';
                else compareClass = 'bbox-equal';
                if (boxCompare === 'notequal' && bboxCount !== expected) {
                    compareClass = 'bbox-notequal';
                }
            }
        }
        rows.push(`
            <div class="image-item ${active} ${compareClass}" style="height:${imageRowHeight}px" onclick="selectImageByIndex(${i})">
                <button type="button" class="image-delete-btn" title="Xóa ảnh" onclick="deleteImageByIndex(event, ${i})">×</button>
                <div class="image-item-icon">◆</div>
                <div class="cell name" title="${esc(it.rel || it.name || '')}">
                    <div class="image-name-main">${esc(it.name || it.rel)}</div>
                    <div class="image-name-sub">${esc(it.modified_at || '-')}</div>
                </div>
                <div class="image-item-count" title="BBox: ${bboxCount}">${bboxCount}</div>
            </div>
        `);
    }

    box.innerHTML = `
        <div class="image-list-spacer" style="height:${total * imageRowHeight}px">
            <div class="image-list-window" style="transform:translateY(${offsetY}px)">
                ${rows.join('')}
            </div>
        </div>
    `;
}

function ensureImageIndexVisible(targetIndex) {
    const box = document.getElementById('imageList');
    if (!box || targetIndex < 0) return;
    const top = targetIndex * imageRowHeight;
    const bottom = top + imageRowHeight;
    const viewTop = box.scrollTop;
    const viewBottom = viewTop + box.clientHeight;

    if (top < viewTop) {
        box.scrollTop = top;
    } else if (bottom > viewBottom) {
        box.scrollTop = Math.max(0, bottom - box.clientHeight);
    }
}

async function loadImages(page = 1, query = currentQuery) {
    if (images[idx]) {
        await saveCurrentLabelIfDirty();
    }
    setEditorLoadProgress(5, 'Đang tải danh sách ảnh...');
    currentQuery = String(query || '').trim();
    const targetRel = pendingInitialRel || '';
    const expectedBoxesParam = String(expectedBoxCount || '').trim();
    const data = await apiGet(msaMode
        ? `/api/project/msa/images?project=${encodeURIComponent(projectName)}`
        : `/api/project_images?project=${encodeURIComponent(projectName)}&page=${page}&page_size=${pageSize}&q=${encodeURIComponent(currentQuery)}&sort_by=${encodeURIComponent(sortBy)}&sort_dir=${encodeURIComponent(sortDir)}&class_filter=${encodeURIComponent(classFilter)}&expected_boxes=${encodeURIComponent(expectedBoxesParam)}&box_compare=${encodeURIComponent(boxCompare)}&anomaly_filter=${encodeURIComponent(anomalyFilter)}&anomaly_sensitivity=${encodeURIComponent(anomalySensitivity)}&rel=${encodeURIComponent(targetRel)}`);
    setEditorLoadProgress(45, 'Đã nhận danh sách ảnh, đang xử lý...');
    images = Array.isArray(data.images) ? data.images : [];

    currentPage = Number(data.page || 1);
    totalImages = Number(data.total || 0);
    totalPages = Number(data.total_pages || 0);

        setStatus('Không có ảnh trong thư mục image/images');
        setImageInfo('-', '-', '');
        setEditorLoadProgress(100, 'Không có ảnh');
        setTimeout(() => hideEditorLoadProgress(), 500);
        return;
    }
    idx = 0;
    if (pendingInitialRel) {
        const targetIdx = images.findIndex(x => String(x || '').toLowerCase() === String(pendingInitialRel || '').toLowerCase());
        if (targetIdx >= 0) {
            idx = targetIdx;
        }
        pendingInitialRel = '';
    }
    setEditorLoadProgress(70, 'Đang render danh sách ảnh...');
    renderImageList();
    setEditorLoadProgress(82, 'Đang tải ảnh đầu tiên...');

async function loadCurrentImageAndLabel() {
    if (!images[idx]) return;
    const rel = images[idx];
    setEditorLoadProgress(10, `Đang tải ảnh: ${rel}`);

    const img = new Image();
    img.src = msaMode
        ? `/api/project/msa/file?project=${encodeURIComponent(projectName)}&rel=${encodeURIComponent(`images/${rel}`)}`
        : `/api/project_image_file?project=${encodeURIComponent(projectName)}&rel=${encodeURIComponent(rel)}`;
    await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
    });
    setEditorLoadProgress(50, 'Đã tải ảnh, đang đọc label...');

    baseImg = img;
    const wrap = document.querySelector('.canvas-wrap');
    const maxW = msaMode ? Math.max(1, (wrap?.clientWidth || 700) - 4) : Math.max(900, Math.floor((wrap ? wrap.clientWidth : 1400) - 24));
    const maxH = msaMode ? Math.max(1, (wrap?.clientHeight || 500) - 4) : Math.max(650, window.innerHeight - 220);
    const ratio = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);
    drawW = Math.max(1, Math.round(img.naturalWidth * ratio));
    drawH = Math.max(1, Math.round(img.naturalHeight * ratio));
    fitDrawW = drawW;
    fitDrawH = drawH;
    zoomLevel = 1;

    canvas.width = drawW;
    canvas.height = drawH;

    const data = await apiGet(msaMode
        ? `/api/project/msa/label?project=${encodeURIComponent(projectName)}&rel=${encodeURIComponent(rel)}`
        : `/api/project_label?project=${encodeURIComponent(projectName)}&rel=${encodeURIComponent(rel)}&anomaly_sensitivity=${encodeURIComponent(anomalySensitivity)}`);
    setEditorLoadProgress(72, 'Đã đọc label, đang dựng bbox...');
    currentImageAnomalyItems = Array.isArray(data.anomaly_items) ? data.anomaly_items : [];
    const anomalyIndexSet = new Set(Array.isArray(data.anomaly_box_indices) ? data.anomaly_box_indices.map(x => Number(x)) : []);
    boxes = parseYoloLabel(data.text || '', anomalyIndexSet);
    selectedBox = boxes.length ? 0 : -1;
    selectedBoxes = selectedBox >= 0 ? new Set([selectedBox]) : new Set();

    draw();
    markLabelClean();
    const item = imageItems[idx] || {};
    setImageInfo(item.name || rel, item.modified_at || '-', rel);
    const anomalyText = Number(data.bbox_anomaly_count || 0) > 0 ? ` | ABN: ${Number(data.bbox_anomaly_count || 0)}` : '';
    setStatus(`Image ${idx + 1}/${images.length}: ${rel}${anomalyText}`);
    ensureImageIndexVisible(idx);
    renderImageList();
    updatePromoteButton();
    setEditorLoadProgress(100, `Đã tải xong: ${rel}`);
    setTimeout(() => hideEditorLoadProgress(), 250);
}

async function runQuickPredictUnlabeled() {
    try {
        await saveCurrentLabelIfDirty();
        setEditorLoadProgress(0, 'Quick Predict: tìm latest best.pt...');
        const data = await apiGet('/api/project/predict_unlabeled/quick', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ project: projectName })
        });

        const taskId = String(data.task_id || '');
        const weightsRel = String(data.weights_rel || 'best.pt');
        let finalMessage = data.message || 'Predict hoàn tất';
        while (true) {
            const status = await apiGet('/api/project/predict_unlabeled/status');
            if (String(status.id || '') !== taskId) {
                throw new Error('Prediction task changed unexpectedly');
            }
            const pct = Math.max(0, Math.min(100, Number(status.progress) || 0));
            const detail = String(status.detail || weightsRel);
            setEditorLoadProgress(pct, `Quick Predict: ${detail}`);

            if (status.status === 'success') {
                finalMessage = status.message || finalMessage;
                setEditorLoadProgress(100, finalMessage);
                break;
            }
            if (status.status === 'failed') {
                throw new Error(status.message || 'Prediction failed');
            }
            await new Promise(resolve => setTimeout(resolve, 800));
        }

        notifyDataChanged('label_editor_quick_predict');
        await loadImages(1, currentQuery);
        setStatus(`${finalMessage} | ${weightsRel}`);
        setTimeout(() => hideEditorLoadProgress(), 600);
    } catch (e) {
        hideEditorLoadProgress();
        alert(String(e.message || e));
    }
}

async function saveLabel() {
    if (!images[idx]) return;
    const rel = images[idx];
    const text = toYoloText();
    syncLabelDirty();
    if (!labelDirty) {
        setCurrentImageStatus(rel, currentImageAnomalyItems.length, 'Không có thay đổi');
        return;
    }
    await apiGet(msaMode ? '/api/project/msa/label' : '/api/project_label', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ project: projectName, rel, text })
    });
    markLabelClean();
    if (msaMode && window.parent !== window) {
        window.parent.postMessage({ type: 'msa-label-saved', project: projectName, image: rel }, window.location.origin);
    }
    const anomalyInfo = await refreshCurrentImageAnomalies(rel);
    const currentItem = imageItems[idx];
    if (currentItem) {
        currentItem.bbox_count = boxes.length;
        currentItem.class_ids = Array.from(new Set(boxes.map(b => Number(b.cls || 0)))).sort((a, b) => a - b);
        currentItem.class_min = currentItem.class_ids.length ? currentItem.class_ids[0] : 1000000000;
        currentItem.bbox_anomaly_count = anomalyInfo?.bboxAnomalyCount || 0;
        currentItem.bbox_has_anomaly = Number(anomalyInfo?.bboxAnomalyCount || 0) > 0;
    }
    renderImageList();
    setCurrentImageStatus(rel, anomalyInfo?.bboxAnomalyCount || 0, 'Đã lưu label');
    notifyDataChanged('label_saved');
}

async function deleteImageByIndex(event, imageIndex) {
    if (event) {
        event.preventDefault();
        event.stopPropagation();
    }
    if (!images.length) return;
    const targetIndex = Math.max(0, Math.min(Number(imageIndex || 0), images.length - 1));
    const rel = images[targetIndex];
    if (!rel) return;
    const ok = window.confirm(`Xóa ảnh này khỏi project?\n\n${rel}\n\nFile label tương ứng cũng sẽ bị xóa nếu tồn tại.`);
    if (!ok) return;

    try {
        await apiGet('/api/project_image', {
            method: 'DELETE',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ project: projectName, rel })
        });

        const deletedCurrent = targetIndex === idx;
        images.splice(targetIndex, 1);
        imageItems.splice(targetIndex, 1);
        totalImages = Math.max(0, totalImages - 1);
        notifyDataChanged('image_deleted');

        if (!images.length) {
            idx = 0;
            baseImg = null;
            drawW = 0;
            drawH = 0;
            canvas.width = 1;
            canvas.height = 1;
            renderImageList();
            updatePageInfo();
            setImageInfo('-', '-', '');
            setStatus('Đã xóa ảnh. Không còn ảnh trong danh sách.');
            draw();
            return;
        }

        if (deletedCurrent) {
            selectedBox = -1;
            selectedBoxes = new Set();
            boxes = [];
            currentImageAnomalyItems = [];
            markLabelClean();
        } else if (targetIndex < idx) {
            idx = Math.max(0, idx - 1);
        }

        if (idx >= images.length) idx = images.length - 1;
        renderImageList();
        updatePageInfo();
        if (deletedCurrent) {
            await loadCurrentImageAndLabel();
        } else {
            setCurrentImageStatus(images[idx], currentImageAnomalyItems.length, `Đã xóa ảnh: ${rel}`);
        }
        setStatus(`Đã xóa ảnh: ${rel}`);
    } catch (e) {
        alert(String(e.message || e));
    }
}

function shouldIgnoreEditorHotkeys(target) {
    if (!target) return false;
    const tag = String(target.tagName || '').toUpperCase();
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'BUTTON') {
        return true;
    }
    return !!target.closest?.('.class-popup');
}

async function onEditorKeyDown(e) {
    if (shouldIgnoreEditorHotkeys(e.target)) return;
    if (e.defaultPrevented) return;

    if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && String(e.key || '').toLowerCase() === 'a') {
        e.preventDefault();
        selectAllBoxes();
        setStatus(`Đã chọn toàn bộ ${boxes.length} bbox`);
        return;
    }

    if (e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) return;

    if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        toggleBboxVisible();
        return;
    }

    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        e.preventDefault();
        await nextImage();
        return;
    }

    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        await prevImage();
    }
}

function onMouseDown(e) {
    if (!canvas) return;
    if (!bboxVisible) return;
    const p = canvasPointFromEvent(e);
    dragStart = {x: p.x, y: p.y};

    const actionHit = hitBoxAction(p.x, p.y);
    if (actionHit) {
        if (actionHit.action === 'duplicate') {
            duplicateBox(actionHit.index);
        } else if (actionHit.action === 'delete') {
            deleteBoxByIndex(actionHit.index);
        }
        dragging = false;
        drawMode = 'none';
        resizeHandle = '';
        return;
    }

    const labelHit = hitBoxLabelIndex(p.x, p.y);
    if (labelHit >= 0) {
        const labelRect = getBoxLabelRect(boxes[labelHit]);
        showClassPopupForBox(labelHit, labelRect);
        dragging = false;
        drawMode = 'none';
        resizeHandle = '';
        draw();
        return;
    }

    const hit = hitBoxIndex(p.x, p.y);
    if (hit >= 0) {
        hideClassPopup();
        selectedBox = hit;
        if (!selectedBoxes.has(hit)) {
            selectedBoxes = new Set([hit]);
        }

        const h = hitResizeHandle(p.x, p.y, boxes[hit]);
        if (h) {
            drawMode = 'resize';
            resizeHandle = h;
            dragging = true;
            draw();
            return;
        }

        const b = boxes[hit];
        drawMode = 'move';
        dragging = true;
        dragOffset.x = p.x - b.x;
        dragOffset.y = p.y - b.y;
        captureSelectedBoxPositions();
        draw();
        return;
    }

    // Draw new bbox on empty area
    hideClassPopup();
    const clsSel = document.getElementById('boxClassSelect');
    const defaultCls = Number.isNaN(parseInt(clsSel.value, 10)) ? 0 : parseInt(clsSel.value, 10);
    const newBox = { cls: defaultCls, x: p.x, y: p.y, w: 1, h: 1 };
    boxes.push(newBox);
    markLabelDirty();
    selectedBox = boxes.length - 1;
    selectedBoxes = new Set([selectedBox]);
    dragStartBoxes = new Map();
    drawMode = 'draw';
    dragging = true;
    draw();
}

function onMouseMove(e) {
    if (!dragging || selectedBox < 0 || !boxes[selectedBox]) return;
    const p = canvasPointFromEvent(e);
    const b = boxes[selectedBox];

    if (drawMode === 'move') {
        const start = dragStartBoxes.get(selectedBox) || { x: b.x, y: b.y };
        const dx = (p.x - dragOffset.x) - start.x;
        const dy = (p.y - dragOffset.y) - start.y;
        moveSelectedBoxesFromDrag(dx, dy);
        markLabelDirty();
    } else if (drawMode === 'draw') {
        const x1 = clamp(dragStart.x, 0, drawW);
        const y1 = clamp(dragStart.y, 0, drawH);
        const x2 = clamp(p.x, 0, drawW);
        const y2 = clamp(p.y, 0, drawH);
        b.x = Math.min(x1, x2);
        b.y = Math.min(y1, y2);
        b.w = Math.max(1, Math.abs(x2 - x1));
        b.h = Math.max(1, Math.abs(y2 - y1));
        markLabelDirty();
    } else if (drawMode === 'resize') {
        let x = b.x, y = b.y, w = b.w, h = b.h;
        const right = b.x + b.w;
        const bottom = b.y + b.h;

        if (resizeHandle.includes('n')) y = clamp(p.y, 0, bottom - 1);
        if (resizeHandle.includes('w')) x = clamp(p.x, 0, right - 1);
        if (resizeHandle.includes('s')) h = clamp(p.y - b.y, 1, drawH - b.y);
        if (resizeHandle.includes('e')) w = clamp(p.x - b.x, 1, drawW - b.x);

        if (resizeHandle.includes('n')) h = Math.max(1, bottom - y);
        if (resizeHandle.includes('w')) w = Math.max(1, right - x);

        b.x = x; b.y = y; b.w = w; b.h = h;
        markLabelDirty();
    }

    draw();
}

function onMouseUp() {
    if (drawMode === 'draw' && selectedBox >= 0 && boxes[selectedBox]) {
        const b = boxes[selectedBox];
        if (b.w < 4 || b.h < 4) {
            boxes.splice(selectedBox, 1);
            syncLabelDirty();
            selectedBox = boxes.length ? boxes.length - 1 : -1;
            selectedBoxes = selectedBox >= 0 ? new Set([selectedBox]) : new Set();
        }
    }
    dragging = false;
    drawMode = 'none';
    resizeHandle = '';
    dragStartBoxes = new Map();
    draw();
}

function onDocumentMouseDown(e) {
    if (classFilterOpen && !e.target.closest?.('#classFilterDropdown')) {
        classFilterOpen = false;
        renderImageTableHead();
    }

    if (!classPopupState.visible) return;
    const popup = getClassPopupEl();
    if (popup && popup.contains(e.target)) return;
    if (canvas && e.target === canvas) return;
    hideClassPopup();
}

(function initCanvasEvents() {
    canvas = document.getElementById('editorCanvas');
    ctx = canvas.getContext('2d');

    canvas.addEventListener('mousedown', onMouseDown);
    const wrap = document.querySelector('.canvas-wrap');
    if (wrap) wrap.addEventListener('wheel', onCanvasWheel, { passive: false });
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseup', onMouseUp);
    document.addEventListener('mousedown', onDocumentMouseDown);
    document.addEventListener('keydown', onEditorKeyDown);
})();

(function initVirtualImageList() {
    const imageList = document.getElementById('imageList');
    if (!imageList) return;
    imageList.addEventListener('scroll', () => renderImageList());
})();

(async function init() {
    try {
        await Promise.all([loadClasses(), loadImages()]);
        if (msaMode && window.parent !== window) {
            window.parent.postMessage({ type: 'msa-editor-ready', project: projectName }, window.location.origin);
        }
    } catch (e) {
        setStatus(String(e.message || e));
    }
})();
window.addEventListener('message', async event => {
    if (!msaMode || event.origin !== window.location.origin) return;
    if (event.data?.type === 'msa-refresh-images') {
        pendingInitialRel = String(event.data.image || images[idx] || '');
        try { await loadImages(1, currentQuery); }
        catch (error) { setStatus(String(error.message || error)); }
        return;
    }
    if (event.data?.type !== 'msa-open-image') return;
    const target = images.indexOf(String(event.data.image || ''));
    if (target >= 0) {
        try { await switchToImageIndex(target); }
        catch (error) { setStatus(String(error.message || error)); }
    }
});
</script>
